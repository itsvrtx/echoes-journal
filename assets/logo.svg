<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Light Shadow (Top-Left) -->
    <filter id="shadow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-10" dy="-10" stdDeviation="12" flood-color="#FFFFFF" flood-opacity="0.9" />
    </filter>

    <!-- Dark Shadow (Bottom-Right) -->
    <filter id="shadow-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="12" dy="12" stdDeviation="15" flood-color="#A3B1C6" flood-opacity="0.6" />
    </filter>

    <!-- Soft Ambient Surface Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6ECF5" />
      <stop offset="100%" stop-color="#D8E0EC" />
    </linearGradient>

    <!-- Accent Gradient for Echo Waves -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7" />
      <stop offset="100%" stop-color="#8E7CF0" />
    </linearGradient>
  </defs>

  <!-- Base Neumorphic Canvas Tile -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg-grad)" />

  <!-- Extruded Central Circle (Soft UI Layer) -->
  <g filter="url(#shadow-dark)">
    <g filter="url(#shadow-light)">
      <circle cx="256" cy="256" r="140" fill="#E0E5EC" />
    </g>
  </g>

  <!-- Echo Waves (Acoustic / Reflection Visuals) -->
  <g fill="none" stroke="url(#accent-grad)" stroke-linecap="round">
    <!-- Inner Ripple -->
    <path d="M 216 200 A 70 70 0 0 1 216 312" stroke-width="12" opacity="0.4" />
    <!-- Center Ripple -->
    <path d="M 190 176 A 100 100 0 0 1 190 336" stroke-width="14" opacity="0.7" />
    <!-- Outer Ripple -->
    <path d="M 164 152 A 130 130 0 0 1 164 360" stroke-width="16" opacity="1.0" />
  </g>

  <!-- Modern Journal Pen Nib / Reflection Node -->
  <path d="M 290 200 L 330 240 L 270 300 L 240 300 L 240 270 Z" fill="url(#accent-grad)" />
  <circle cx="310" cy="220" r="4" fill="#FFFFFF" />
</svg>
